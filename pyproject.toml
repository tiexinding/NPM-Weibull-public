[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npm-weibull-py"
version = "0.4.0"
description = "Two-parameter Weibull diagnostic framework for transformer weight distributions (companion library for arXiv:2605.XXXXX)"
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-4.0"
authors = [
    {name = "Tiexin Ding", email = "tiexinding@gmail.com"},
]
keywords = [
    "transformer",
    "weight-distribution",
    "weibull",
    "diagnostic",
    "interpretability",
    "training-dynamics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "transformers>=4.35", "safetensors>=0.4"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0"]
all = ["npm-weibull-py[torch,plot,dev]"]

[project.urls]
Homepage = "https://github.com/tiexinding/NPM-Weibull-public"
Repository = "https://github.com/tiexinding/NPM-Weibull-public"
Issues = "https://github.com/tiexinding/NPM-Weibull-public/issues"
Paper = "https://arxiv.org/abs/2605.XXXXX"

[tool.setuptools.packages.find]
where = ["."]
include = ["npm_weibull*"]
exclude = ["tests*", "examples*", "database_v9_1*"]
